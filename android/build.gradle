ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
    kotlinVersion = project.hasProperty('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.1.21'
    transactVersion = '3.28.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.hasProperty('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.1.21'}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Capacitor has no version constant, so read the version of the @capacitor/android package the app
// builds against. Capacitor's CLI points :capacitor-android at node_modules/@capacitor/android/capacitor.
// Null when that package can't be found, so an unusual setup never fails the build.
def capacitorVersion = { ->
    try {
        def capacitorProject = rootProject.findProject(':capacitor-android')
        def packageJson = capacitorProject ? new File(capacitorProject.projectDir.parentFile, 'package.json') : null
        if (packageJson == null || !packageJson.isFile()) return null
        def pkg = new groovy.json.JsonSlurper().parse(packageJson)
        return pkg.name == '@capacitor/android' && pkg.version instanceof String ? pkg.version : null
    } catch (Exception ignored) {
        return null
    }
}()

android {
    namespace = "com.atomicfi.transact"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "TRANSACT_VERSION", "\"$transactVersion\""
        buildConfigField "String", "CAPACITOR_VERSION", capacitorVersion ? "\"$capacitorVersion\"" : "null"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "financial.atomic:transact:$transactVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
