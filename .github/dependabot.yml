version: 2
updates:
  - package-ecosystem: 'swift'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 0
    allow:
      - dependency-name: 'github.com/atomicfi/atomic-transact-ios'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      npm-dependencies:
        patterns:
          - '*'
    allow:
      - dependency-name: '@capacitor/core'

  - package-ecosystem: 'gradle'
    directory: '/android'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 0
    allow:
      - dependency-name: 'financial.atomic:transact'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
