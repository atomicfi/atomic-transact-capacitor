version: 2
updates:
  - package-ecosystem: 'swift'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 0
    allow:
      - dependency-name: 'github.com/atomicfi/atomic-transact-ios'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    allow:
      - dependency-name: '@capacitor/core'

  # Demo app: grouped into a single PR for both version and security updates.
  # Without this entry Dependabot still opens ungrouped security PRs for the
  # lockfile it finds here, one per advisory.
  - package-ecosystem: 'npm'
    directory: '/transact-demo-ionic'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      demo-npm-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
      demo-npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'gradle'
    directory: '/android'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 0
    allow:
      - dependency-name: 'financial.atomic:transact'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
